spring.application.name=ai-web-chat
server.port=8080

# H2 file-based database (persistent across restarts)
spring.datasource.url=jdbc:h2:file:./data/webchat;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123ABCdef*
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# App storage config
app.storage.upload-dir=./uploads
