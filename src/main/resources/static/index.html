<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>AI Web Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ==================== 登录/注册页 ==================== -->
<div id="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><img src="/img/logo.svg" alt="logo"></div>
        <h1>AI Web Chat</h1>
        <p class="subtitle">浏览器即时通讯系统</p>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="auth-username" placeholder="3-32 个字符">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="auth-password" placeholder="至少 6 位">
        </div>
        <div class="form-group" id="nickname-group" style="display:none;">
            <label>昵称（可选）</label>
            <input type="text" id="auth-nickname" placeholder="留空则用用户名">
        </div>
        <button class="btn-primary" id="auth-submit" onclick="handleAuth()">登录</button>
        <div class="switch-link">
            <span id="switch-text">还没有账号？</span>
            <a id="switch-link" onclick="switchAuthMode()">注册</a>
        </div>
        <div class="error-msg" id="auth-error"></div>
    </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="main-page">
    <div class="layout">
        <!-- 导航栏 -->
        <div class="navbar">
            <div class="nav-avatar" id="nav-avatar" onclick="showMyInfo()" title="个人信息"></div>
            <div class="nav-items">
                <div class="nav-item active" id="nav-session" onclick="switchTab('sessions')" title="消息">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                    <span class="nav-badge" id="badge-sessions" style="display:none;">0</span>
                </div>
                <div class="nav-item" id="nav-contacts" onclick="switchTab('contacts')" title="通讯录">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v4M8 2v4M3 6h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/><circle cx="12" cy="13" r="2.5"/><path d="M7 19c0-2.5 2-4 5-4s5 1.5 5 4"/></svg>
                    <span class="nav-badge" id="badge-requests" style="display:none;">0</span>
                </div>
                <div class="nav-item" onclick="openCreateGroupModal()" title="创建群组">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 3.5v6M13 6.5h6"/></svg>
                </div>
            </div>
            <div class="nav-bottom">
                <div class="nav-item" id="nav-me" onclick="showMyInfo()" title="我的">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>
        </div>

        <!-- 侧栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-box" id="search-input"
                       placeholder="搜索用户..." oninput="handleSearchInput()">
            </div>
            <div class="sidebar-list" id="sidebar-list"></div>
        </div>

        <!-- 聊天区 -->
        <div class="chat-area" id="chat-area">
            <div class="empty-state" id="chat-empty">
                <div class="empty-icon">💬</div>
                <div>选择一个会话开始聊天</div>
            </div>
            <div id="chat-main" style="display:none; flex:1; flex-direction:column; min-height:0;">
                <!-- 聊天标题栏 -->
                <div class="chat-header">
                    <div class="back-btn icon-btn" onclick="backToList()" title="返回">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    </div>
                    <div style="flex:1; min-width:0;">
                        <span class="chat-title" id="chat-title"></span>
                        <span class="chat-subtitle" id="chat-subtitle"></span>
                    </div>
                    <div class="chat-header-actions">
                        <span class="conn-status connected" id="conn-status">
                            <span class="conn-dot"></span>
                            <span id="conn-text">已连接</span>
                        </span>
                        <div class="icon-btn" onclick="toggleSearchBar()" title="搜索聊天记录">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>
                        <div class="icon-btn" onclick="toggleDetailPanel()" title="详情">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                        </div>
                    </div>
                </div>

                <!-- 聊天记录搜索栏 -->
                <div class="search-bar" id="search-bar">
                    <input type="text" id="msg-search-input" placeholder="输入关键词搜索聊天记录..."
                           oninput="doMessageSearch(this.value)">
                    <span class="search-result-info" id="search-result-info"></span>
                    <div class="search-nav-btns">
                        <div class="search-nav-btn" onclick="searchJump(-1)" title="上一个">↑</div>
                        <div class="search-nav-btn" onclick="searchJump(1)" title="下一个">↓</div>
                        <div class="search-nav-btn close" onclick="closeSearchBar()" title="关闭">×</div>
                    </div>
                </div>

                <!-- 消息列表 -->
                <div class="messages-area" id="messages-area"></div>

                <!-- 输入区 -->
                <div class="input-area">
                    <div class="input-toolbar">
                        <div class="toolbar-btn" id="emoji-btn" onclick="toggleEmojiPanel()" title="表情">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2"/><line x1="9" y1="9.5" x2="9.01" y2="9.5"/><line x1="15" y1="9.5" x2="15.01" y2="9.5"/></svg>
                        </div>
                        <div class="toolbar-btn" onclick="document.getElementById('file-image-input').click()" title="图片">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        </div>
                        <div class="toolbar-btn" onclick="document.getElementById('file-upload-input').click()" title="文件">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                        </div>
                        <input type="file" id="file-image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
                        <input type="file" id="file-upload-input" style="display:none;" onchange="handleFileUpload(this)">
                        <!-- 表情面板 -->
                        <div class="emoji-panel" id="emoji-panel">
                            <div class="emoji-tabs">
                                <div class="emoji-tab active" onclick="switchEmojiTab('emoji', this)">Emoji</div>
                                <div class="emoji-tab" onclick="switchEmojiTab('sticker', this)">小黄脸</div>
                                <div class="emoji-tab" onclick="switchEmojiTab('mine', this)">我的</div>
                            </div>
                            <div class="emoji-content" id="emoji-content"></div>
                        </div>
                    </div>
                    <div class="input-row">
                        <textarea class="input-box" id="input-box"
                                  onkeydown="handleInputKeyDown(event)"
                                  oninput="handleInput()"></textarea>
                        <button class="send-btn" id="send-btn" onclick="handleSend()" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详情面板 -->
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header" id="detail-title">详情</div>
            <div class="detail-body" id="detail-body"></div>
        </div>
    </div>
</div>

<!-- ==================== 模态弹窗 ==================== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 新消息页内弹窗容器（右下角） -->
<div id="toast-notify-container"></div>

<!-- 图片大图 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
</div>

    <script src="/js/app.js"></script>

</body>
</html>
