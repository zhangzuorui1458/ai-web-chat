<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A2A5E" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>送信鸦</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ==================== 登录/注册页 ==================== -->
<div id="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><img src="/img/logo.svg" alt="logo"></div>
        <h1 class="auth-title"><img src="/img/songxinya_white.png" alt="送信鸦"></h1>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="auth-username" placeholder="3-32 个字符" oninput="validateAuthInput()">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="auth-password" placeholder="至少 6 位" oninput="validateAuthInput()">
        </div>
        <div class="form-group" id="nickname-group" style="display:none;">
            <label>昵称（可选）</label>
            <input type="text" id="auth-nickname" placeholder="留空则用用户名">
        </div>
        <button class="btn-primary" id="auth-submit" onclick="handleAuth()">登录</button>
        <div class="switch-link">
            <span id="switch-text">还没有账号？</span>
            <a id="switch-link" onclick="switchAuthMode()">注册</a>
        </div>
        <div class="error-msg" id="auth-error"></div>
        <div class="auth-footer">作瑞士卷 AI 制</div>
    </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="main-page">
    <div class="layout">
        <!-- 导航栏 -->
        <div class="navbar">
            <div class="nav-avatar" id="nav-avatar" onclick="showMyInfo()" title="个人信息"></div>
            <div class="nav-items">
                <div class="nav-item active" id="nav-session" onclick="switchTab('sessions')" title="消息">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                    <span class="nav-badge" id="badge-sessions" style="display:none;">0</span>
                </div>
                <div class="nav-item" id="nav-contacts" onclick="switchTab('contacts')" title="通讯录">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v4M8 2v4M3 6h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/><circle cx="12" cy="13" r="2.5"/><path d="M7 19c0-2.5 2-4 5-4s5 1.5 5 4"/></svg>
                    <span class="nav-badge" id="badge-requests" style="display:none;">0</span>
                </div>
                <div class="nav-item" id="nav-eat" onclick="switchTab('eat')" title="今天吃什么">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2s2-.9 2-2V2"/><path d="M5 11v11"/><path d="M17 2c-1.7 0-3 2.2-3 5s1.3 5 3 5v13"/></svg>
                </div>
            </div>
            <div class="nav-bottom">
                <div class="nav-item" id="nav-me" onclick="showMyInfo()" title="我的">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>
        </div>

        <!-- 侧栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-box" id="search-input"
                       placeholder="搜索用户..." oninput="handleSearchInput()">
            </div>
            <div class="sidebar-list" id="sidebar-list"></div>
        </div>

        <!-- 聊天区 -->
        <div class="chat-area" id="chat-area">
            <div class="empty-state" id="chat-empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 96 96" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="emptyGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#2E9FFF"/>
                                <stop offset="100%" stop-color="#0051D5"/>
                            </linearGradient>
                        </defs>
                        <path d="M16 40 C16 24 28 16 48 16 C68 16 80 24 80 40 C80 56 68 64 48 64 C44 64 40 63.5 36 62 L24 70 Q20 72 19.5 68 L19 60 C17 55 16 48 16 40 Z" fill="url(#emptyGrad)" opacity="0.85"/>
                        <circle cx="38" cy="40" r="3" fill="#fff"/>
                        <circle cx="48" cy="40" r="3" fill="#fff"/>
                        <circle cx="58" cy="40" r="3" fill="#fff"/>
                    </svg>
                </div>
                <div class="empty-title">开始对话</div>
                <div class="empty-desc">从左侧选择一个会话，开启你的聊天</div>
            </div>
            <div id="chat-main" style="display:none; flex:1; flex-direction:column; min-height:0;">
                <!-- 聊天标题栏 -->
                <div class="chat-header">
                    <div class="back-btn icon-btn" onclick="backToList()" title="返回">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    </div>
                    <div style="flex:1; min-width:0;">
                        <span class="chat-title" id="chat-title"></span>
                        <span class="chat-subtitle" id="chat-subtitle"></span>
                    </div>
                    <div class="chat-header-actions">
                        <span class="conn-status connected" id="conn-status">
                            <span class="conn-dot"></span>
                            <span id="conn-text">已连接</span>
                        </span>
                        <div class="icon-btn" onclick="toggleSearchBar()" title="搜索聊天记录">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>
                        <div class="icon-btn" onclick="toggleDetailPanel()" title="详情">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                        </div>
                    </div>
                </div>

                <!-- 聊天记录搜索栏 -->
                <div class="search-bar" id="search-bar">
                    <input type="text" id="msg-search-input" placeholder="输入关键词搜索聊天记录..."
                           oninput="doMessageSearch(this.value)">
                    <span class="search-result-info" id="search-result-info"></span>
                    <div class="search-nav-btns">
                        <div class="search-nav-btn" onclick="searchJump(-1)" title="上一个">↑</div>
                        <div class="search-nav-btn" onclick="searchJump(1)" title="下一个">↓</div>
                        <div class="search-nav-btn close" onclick="closeSearchBar()" title="关闭">×</div>
                    </div>
                </div>

                <!-- 消息列表 -->
                <div class="messages-area" id="messages-area"></div>

                <!-- 输入区 -->
                <div class="input-area">
                    <div class="recording-indicator" id="recording-indicator" style="display:none;">
                        <span class="rec-dot"></span>
                        <span class="rec-text">录音中</span>
                        <span class="rec-time" id="rec-time">0:00</span>
                        <span class="rec-hint">最多 60 秒</span>
                        <span class="rec-cancel" onclick="cancelRecording()">取消</span>
                        <span class="rec-send" onclick="stopRecordingAndSend()">发送</span>
                    </div>
                    <div class="input-toolbar" id="input-toolbar">
                        <textarea class="input-box" id="input-box"
                                  onkeydown="handleInputKeyDown(event)"
                                  oninput="handleInput()"></textarea>
                        <div class="toolbar-btn" id="emoji-btn" onclick="toggleEmojiPanel()" title="表情">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2"/><line x1="9" y1="9.5" x2="9.01" y2="9.5"/><line x1="15" y1="9.5" x2="15.01" y2="9.5"/></svg>
                        </div>
                        <div class="toolbar-btn voice-btn" id="voice-btn" onclick="toggleRecording()" title="语音">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                        </div>
                        <div class="toolbar-btn more-trigger" onclick="toggleMoreMenu(event)" title="更多">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </div>
                        <button class="send-btn" id="send-btn" onclick="handleSend()" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg></button>

                        <div class="more-menu" id="more-menu">
                            <div class="more-item" onclick="document.getElementById('file-image-input').click(); closeMoreMenu();">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                <span>图片</span>
                            </div>
                            <div class="more-item" onclick="document.getElementById('file-upload-input').click(); closeMoreMenu();">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                                <span>文件</span>
                            </div>
                            <div class="more-item" onclick="openFavoritesModal({mode:'forward'}); closeMoreMenu();">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
                                <span>发送收藏</span>
                            </div>
                            <div class="more-item" onclick="sendEatDish(); closeMoreMenu();">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2s2-.9 2-2V2"/><path d="M5 11v11"/><path d="M17 2c-1.7 0-3 2.2-3 5s1.3 5 3 5v13"/></svg>
                                <span>今天吃什么</span>
                            </div>
                        </div>

                        <div class="mention-panel" id="mention-panel">
                            <div class="mention-list" id="mention-list"></div>
                        </div>

                        <div class="emoji-panel" id="emoji-panel">
                            <div class="emoji-tabs">
                                <div class="emoji-tab active" onclick="switchEmojiTab('emoji', this)">Emoji</div>
                                <div class="emoji-tab" onclick="switchEmojiTab('sticker', this)">小黄脸</div>
                                <div class="emoji-tab" onclick="switchEmojiTab('mine', this)">我的</div>
                            </div>
                            <div class="emoji-content" id="emoji-content"></div>
                        </div>

                        <input type="file" id="file-image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
                        <input type="file" id="file-upload-input" style="display:none;" onchange="handleFileUpload(this)">
                    </div>
                </div>
            </div>
        </div>

        <!-- 详情面板 -->
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header" id="detail-title">详情</div>
            <div class="detail-body" id="detail-body"></div>
        </div>

        <!-- 今天吃什么页面（独占主区域） -->
        <div class="eat-page" id="eat-page" style="display:none;">
            <div class="eat-header">
                <div class="eat-title-wrap">
                    <span class="eat-title">今天吃什么</span>
                    <span class="eat-slogan">牛吃草，马吃料，牛马吃什么？</span>
                </div>
                <div class="eat-header-actions">
                    <div class="eat-icon-btn" id="eat-mode-btn" onclick="toggleEatMode()" title="切换掷骰子/滑动模式">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="16" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="16" r="1.4" fill="currentColor"/></svg>
                    </div>
                    <div class="eat-icon-btn" onclick="toggleEatHistory()" title="历史时间轴">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                    </div>
                    <div class="eat-icon-btn" onclick="openEatManage()" title="管理拉黑/不喜欢">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    </div>
                </div>
            </div>

            <div class="eat-meals" id="eat-meals"></div>
            <div class="eat-categories" id="eat-categories"></div>

            <div class="eat-main">
                <div class="eat-stage" id="eat-stage"></div>
                <div class="eat-empty" id="eat-empty" style="display:none;">
                    <div class="eat-empty-emoji">🍽️</div>
                    <div class="eat-empty-main">都被拉黑完啦</div>
                    <div class="eat-empty-sub">点击右上角刷新按钮重置</div>
                </div>
            </div>

            <div class="eat-actions">
                <div class="eat-action-btn dislike" onclick="eatAction('dislike')" title="不喜欢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </div>
                <div class="eat-action-btn block" onclick="eatAction('block')" title="拉黑">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                </div>
                <div class="eat-action-btn love" onclick="eatAction('love')" title="喜欢">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </div>
            </div>

            <div class="eat-bottom-actions">
                <button class="eat-dice-roll-btn" id="eat-dice-roll-btn" onclick="rollDice()" style="display:none;">🎲 再来一次</button>
                <button class="eat-pick-btn" onclick="eatPick()">就它了</button>
            </div>

            <!-- 时间轴抽屉 -->
            <div class="eat-history-panel" id="eat-history-panel">
                <div class="eat-history-header">
                    <span>吃过时间轴</span>
                    <div class="eat-icon-btn" onclick="toggleEatHistory(false)" title="关闭">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </div>
                </div>
                <div class="eat-history-list" id="eat-history-list"></div>
                <div class="eat-history-footer" onclick="clearEatHistory()">清空记录</div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 模态弹窗 ==================== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 新消息页内弹窗容器（右下角） -->
<div id="toast-notify-container"></div>

<!-- 图片大图 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
</div>

    <script src="/js/app.js"></script>

</body>
</html>
