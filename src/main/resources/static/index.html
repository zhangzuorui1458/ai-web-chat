<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Web Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        /* ==================== 主题变量（白天默认） ==================== */
        :root {
            --bg-page: #f0f2f5;
            --bg-navbar: #2e2e2e;
            --bg-navbar-hover: #3d3d3d;
            --bg-sidebar: #f5f5f5;
            --bg-chat: #f5f5f5;
            --bg-header: #f5f5f5;
            --bg-input-area: #f5f5f5;
            --bg-input-box: #fff;
            --bg-bubble-other: #fff;
            --bg-conv-hover: #eaeaea;
            --bg-conv-active: #d6d6d6;
            --bg-modal: #fff;
            --bg-search-bar: #ebebeb;
            --bg-toast: #fff;

            --text-primary: #1f2329;
            --text-secondary: #7a7a7a;
            --text-muted: #b0b0b0;
            --text-on-accent: #fff;
            --text-bubble-mine: #1f2329;

            --border: #e5e5e5;
            --border-light: #ebebeb;
            --scrollbar: #c9cdd4;

            --accent: #07c160;
            --accent-dark: #06ad56;
            /* 气泡颜色：可由 JS 覆盖（白/灰/天蓝/微信绿） */
            --bubble-mine: #95EC69;

            --shadow: rgba(0,0,0,0.12);
        }

        /* 黑夜模式覆盖 */
        body.theme-dark {
            --bg-page: #181818;
            --bg-navbar: #000000;
            --bg-navbar-hover: #1f1f1f;
            --bg-sidebar: #232323;
            --bg-chat: #1f1f1f;
            --bg-header: #1f1f1f;
            --bg-input-area: #1f1f1f;
            --bg-input-box: #2a2a2a;
            --bg-bubble-other: #2a2a2a;
            --bg-conv-hover: #2c2c2c;
            --bg-conv-active: #3a3a3a;
            --bg-modal: #2a2a2a;
            --bg-search-bar: #2a2a2a;
            --bg-toast: #2a2a2a;

            --text-primary: #e8e8e8;
            --text-secondary: #aaa;
            --text-muted: #777;
            --text-on-accent: #fff;
            --text-bubble-mine: #1f2329;

            --border: #333;
            --border-light: #2a2a2a;
            --scrollbar: #444;

            --shadow: rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        button { cursor: pointer; border: none; outline: none; background: none; }
        input { outline: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ==================== 登录/注册页 ==================== */
        #auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #07c160, #06ad56);
        }
        .auth-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px 32px;
            width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .auth-card h1 {
            text-align: center; margin-bottom: 8px; color: #07c160; font-size: 24px;
        }
        .auth-card .subtitle {
            text-align: center; color: #8a919f; font-size: 13px; margin-bottom: 28px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; color: #4e5969; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid #e5e6eb;
            border-radius: 6px; font-size: 14px; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #07c160; }
        .btn-primary {
            width: 100%; padding: 11px; background: #07c160; color: #fff;
            border-radius: 6px; font-size: 15px; margin-top: 8px; transition: background 0.2s;
        }
        .btn-primary:hover { background: #06ad56; }
        .btn-primary:disabled { background: #a5eccb; cursor: not-allowed; }
        .switch-link { text-align: center; margin-top: 18px; font-size: 13px; color: #4e5969; }
        .switch-link a { color: #07c160; text-decoration: none; cursor: pointer; }
        .error-msg {
            color: #f53f3f; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px;
        }

        /* ==================== 主界面布局 ==================== */
        #main-page { display: none; height: 100vh; }
        .layout { display: flex; height: 100vh; }

        /* 导航栏 */
        .navbar {
            width: 60px;
            background: var(--bg-navbar);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .nav-avatar {
            width: 36px; height: 36px; border-radius: 6px;
            background: #07c160; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 600; margin-bottom: 20px;
            overflow: hidden; cursor: pointer;
        }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nav-items { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .nav-item {
            width: 42px; height: 42px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #9a9a9a; cursor: pointer; position: relative;
            transition: all 0.2s;
        }
        .nav-item svg { width: 22px; height: 22px; display: block; }
        .nav-item:hover { color: #fff; background: var(--bg-navbar-hover); }
        .nav-item.active { color: var(--accent); }
        .nav-item.active::before {
            content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
            width: 4px; height: 24px; background: #07c160; border-radius: 0 2px 2px 0;
        }
        .nav-badge {
            position: absolute; top: 4px; right: 4px;
            min-width: 16px; height: 16px; padding: 0 4px;
            background: #f53f3f; color: #fff; font-size: 10px; line-height: 16px;
            border-radius: 8px; text-align: center; font-weight: 600;
        }
        .nav-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }

        /* 侧栏（会话/联系人列表） */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .search-box {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 13px; background: var(--bg-input-box);
        }
        .search-box:focus { border-color: var(--accent); }
        .sidebar-list { flex: 1; overflow-y: auto; }

        /* 会话列表项 */
        .conv-item {
            display: flex; padding: 12px 16px; cursor: pointer; gap: 10px;
            border-bottom: 1px solid var(--border-light); transition: background 0.15s;
        }
        .conv-item:hover { background: var(--bg-conv-hover); }
        .conv-item.active { background: var(--bg-conv-active); }
        .conv-avatar {
            width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
            background: var(--accent); color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 16px; font-weight: 600; overflow: hidden;
            position: relative;
        }
        .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .conv-avatar.group { border-radius: 8px; background: #7a7a7a; }
        .conv-body { flex: 1; min-width: 0; }
        .conv-top-row { display: flex; justify-content: space-between; align-items: center; }
        .conv-name {
            font-size: 14px; font-weight: 500; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .conv-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; margin-left: 8px; }
        .conv-bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .conv-preview {
            font-size: 12px; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .conv-unread {
            min-width: 18px; height: 18px; padding: 0 5px; background: #f53f3f; color: #fff;
            font-size: 11px; line-height: 18px; border-radius: 9px; text-align: center;
            flex-shrink: 0; margin-left: 8px; font-weight: 600;
        }

        /* 联系人列表项 */
        .contact-item {
            display: flex; padding: 10px 16px; cursor: pointer; gap: 10px;
            border-bottom: 1px solid var(--border-light); transition: background 0.15s;
        }
        .contact-item:hover { background: var(--bg-conv-hover); }
        .contact-avatar {
            width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
            background: var(--accent); color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 14px; font-weight: 600; overflow: hidden;
        }
        .contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .contact-name {
            font-size: 14px; line-height: 36px; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ==================== 聊天主区域 ==================== */
        .chat-area {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0;
        }
        .chat-header {
            height: 56px; padding: 0 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg-header);
        }
        .chat-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .chat-subtitle { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }
        .chat-header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
        }
        .icon-btn svg { width: 20px; height: 20px; display: block; }
        .icon-btn:hover { background: var(--bg-conv-hover); color: var(--text-primary); }

        /* 连接状态胶囊 */
        .conn-status {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 8px;
        }
        .conn-status.connected { background: #e8f7ee; color: #06ad56; }
        .conn-status.connecting { background: #fff3e8; color: #f77200; }
        .conn-status.disconnected { background: #fce8e8; color: #f53f3f; }
        .conn-dot { width: 6px; height: 6px; border-radius: 50%; }
        .conn-status.connected .conn-dot { background: #06ad56; }
        .conn-status.connecting .conn-dot { background: #f77200; }
        .conn-status.disconnected .conn-dot { background: #f53f3f; }

        /* 消息区 */
        .messages-area {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .time-separator {
            text-align: center; font-size: 11px; color: var(--text-muted); margin: 16px 0 8px;
        }
        .msg-row {
            display: flex; gap: 8px; margin-bottom: 4px; position: relative;
        }
        .msg-row.mine { flex-direction: row-reverse; }
        .msg-avatar {
            width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
            background: var(--accent); color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 14px; font-weight: 600; overflow: hidden;
        }
        .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg-content-wrap { display: flex; flex-direction: column; max-width: 60%; }
        .msg-row.mine .msg-content-wrap { align-items: flex-end; }
        .msg-sender-name {
            font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; margin-left: 4px;
        }
        .msg-row.mine .msg-sender-name { display: none; }
        .msg-bubble {
            padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 1.5;
            word-break: break-word; position: relative; max-width: 100%;
        }
        .msg-bubble.text { background: var(--bg-bubble-other); color: var(--text-primary); }
        .msg-row.mine .msg-bubble.text { background: var(--bubble-mine); color: var(--text-bubble-mine); }
        .msg-bubble.image { background: transparent; padding: 0; }
        .msg-bubble.image img { max-width: 200px; max-height: 200px; border-radius: 6px; cursor: pointer; }
        .msg-bubble.file {
            display: flex; align-items: center; gap: 10px; background: var(--bg-bubble-other); padding: 10px 14px;
            min-width: 220px;
        }
        .msg-bubble.file .file-icon {
            width: 40px; height: 40px; background: var(--accent); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: #fff;
            flex-shrink: 0;
        }
        .msg-bubble.file .file-icon svg { width: 22px; height: 22px; display: block; }
        .msg-bubble.file .file-info { flex: 1; min-width: 0; }
        .msg-bubble.file .file-name {
            font-size: 13px; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-bubble.file .file-size { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .msg-bubble.file .file-download {
            font-size: 13px; color: var(--accent); text-decoration: none; flex-shrink: 0;
        }
        .msg-bubble.emoji {
            font-size: 32px; background: transparent; padding: 0; line-height: 1;
        }
        .msg-bubble.recall-notice {
            background: transparent !important; color: var(--text-muted); font-size: 12px;
            text-align: center; padding: 4px 12px;
        }
        .msg-read-status {
            font-size: 11px; color: var(--text-muted); margin-top: 2px; margin-right: 4px;
        }
        .msg-row.mine .msg-read-status { text-align: right; }

        /* 消息操作菜单 */
        .msg-actions {
            position: absolute; top: -28px; right: 0;
            background: var(--bg-input-box); border: 1px solid var(--border); border-radius: 6px;
            box-shadow: 0 2px 8px var(--shadow); display: none; z-index: 10;
            padding: 2px 0;
        }
        .msg-row.mine .msg-actions { right: auto; left: 0; }
        .msg-row:hover .msg-actions { display: flex; gap: 0; }
        .msg-row.actions-active .msg-actions { display: flex; gap: 0; }
        .msg-action-btn {
            padding: 4px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer;
            white-space: nowrap;
        }
        .msg-action-btn:hover { background: var(--bg-conv-hover); color: var(--accent); }

        /* 输入区 */
        .input-area {
            border-top: 1px solid var(--border); padding: 8px 20px 16px; background: var(--bg-input-area);
        }

        /* 聊天记录搜索栏 */
        .search-bar {
            display: none;
            padding: 8px 16px;
            background: var(--bg-search-bar);
            border-bottom: 1px solid var(--border);
            align-items: center;
            gap: 8px;
        }
        .search-bar.show { display: flex; }
        .search-bar input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            background: var(--bg-input-box);
            color: var(--text-primary);
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-result-info {
            font-size: 12px; color: var(--text-secondary); white-space: nowrap;
        }
        .search-nav-btns { display: flex; gap: 2px; }
        .search-nav-btn {
            width: 26px; height: 26px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; color: var(--text-secondary);
            background: var(--bg-input-box); border: 1px solid var(--border);
        }
        .search-nav-btn:hover { background: var(--bg-conv-hover); color: var(--accent); }
        .search-nav-btn.close { font-size: 20px; }

        /* 搜索匹配高亮 */
        .msg-row.search-match {
            background: rgba(255, 228, 163, 0.5);
            box-shadow: inset 3px 0 0 #f77200;
        }
        .msg-row.search-current {
            background: #ffe4a3;
        }
        mark.search-highlight {
            background: #ffe4a3; color: inherit; padding: 0 2px; border-radius: 2px;
        }
        .input-toolbar {
            display: flex; gap: 4px; margin-bottom: 8px; align-items: center;
            position: relative;
        }
        .toolbar-btn {
            width: 32px; height: 32px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; position: relative;
            transition: all 0.15s;
        }
        .toolbar-btn svg { width: 22px; height: 22px; display: block; }
        .toolbar-btn:hover { background: var(--bg-conv-hover); color: var(--text-primary); }
        .toolbar-btn.active { color: var(--accent); }
        .input-box {
            width: 100%; min-height: 64px; max-height: 120px; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
            font-family: inherit; resize: none; background: var(--bg-input-box); color: var(--text-primary); line-height: 1.5;
        }
        .input-box:focus { border-color: var(--accent); }
        .input-bottom {
            display: flex; justify-content: flex-end; margin-top: 8px; align-items: center;
        }
        .send-btn {
            padding: 6px 20px; background: var(--accent); color: #fff;
            border-radius: 4px; font-size: 13px; cursor: pointer; transition: background 0.2s;
        }
        .send-btn:hover { background: var(--accent-dark); }
        .send-btn:disabled { background: #a5eccb; cursor: not-allowed; }

        /* 表情面板 */
        .emoji-panel {
            position: absolute; bottom: 100%; left: 0; margin-bottom: 8px;
            background: var(--bg-input-box); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow);
            width: 360px; max-height: 280px; display: none; z-index: 100; overflow: hidden;
        }
        .emoji-panel.show { display: flex; flex-direction: column; }
        .emoji-tabs {
            display: flex; border-bottom: 1px solid var(--border-light); padding: 0 8px;
        }
        .emoji-tab {
            padding: 8px 14px; font-size: 13px; color: var(--text-secondary); cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .emoji-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .emoji-content { flex: 1; overflow-y: auto; padding: 8px; }
        .emoji-grid {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
        }
        .emoji-item {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer; border-radius: 4px; transition: background 0.15s;
        }
        .emoji-item:hover { background: var(--bg-conv-hover); }
        .emoji-item.custom-emoji img { width: 32px; height: 32px; object-fit: contain; }
        .emoji-upload-zone {
            padding: 12px; text-align: center; border-top: 1px dashed var(--border); margin-top: 8px;
        }
        .emoji-upload-btn {
            font-size: 13px; color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
        }

        /* 空状态 */
        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 8px;
        }
        .empty-state .empty-icon { font-size: 48px; opacity: 0.3; }

        /* 详情面板 */
        .detail-panel {
            width: 240px; border-left: 1px solid var(--border); background: var(--bg-sidebar);
            display: none; flex-direction: column;
        }
        .detail-panel.show { display: flex; }
        .detail-header {
            padding: 16px; border-bottom: 1px solid var(--border-light); font-size: 14px; font-weight: 600; color: var(--text-primary);
        }
        .detail-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .detail-section-title {
            font-size: 12px; color: var(--text-secondary); margin: 8px 0;
        }
        .member-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 0;
        }
        .member-avatar {
            width: 28px; height: 28px; border-radius: 4px;
            background: var(--accent); color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: 600; overflow: hidden;
        }
        .member-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .member-name { font-size: 13px; color: var(--text-primary); }

        /* ==================== 模态弹窗 ==================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); display: none;
            align-items: center; justify-content: center; z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-modal); border-radius: 8px; padding: 24px;
            width: 420px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 8px 32px var(--shadow);
            color: var(--text-primary);
        }
        .modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--text-primary); }
        .modal-close { float: right; font-size: 20px; color: var(--text-muted); cursor: pointer; }
        .modal-list { max-height: 360px; overflow-y: auto; }
        .modal-list-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-list-item:last-child { border-bottom: none; }
        .modal-item-avatar {
            width: 36px; height: 36px; border-radius: 6px;
            background: var(--accent); color: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 14px; font-weight: 600; overflow: hidden;
            flex-shrink: 0;
        }
        .modal-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .modal-item-body { flex: 1; min-width: 0; }
        .modal-item-name { font-size: 14px; color: var(--text-primary); }
        .modal-item-desc { font-size: 12px; color: var(--text-secondary); }
        .modal-item-actions { display: flex; gap: 6px; }
        .btn-accept {
            padding: 4px 12px; background: var(--accent); color: #fff;
            border-radius: 4px; font-size: 12px; cursor: pointer;
        }
        .btn-reject {
            padding: 4px 12px; background: var(--bg-conv-hover); color: var(--text-primary);
            border-radius: 4px; font-size: 12px; cursor: pointer;
        }
        .search-results { margin-top: 12px; }
        .checkbox-list { margin-top: 12px; max-height: 240px; overflow-y: auto; }
        .checkbox-item {
            display: flex; align-items: center; gap: 8px; padding: 8px 0;
            border-bottom: 1px solid var(--border-light); cursor: pointer;
        }
        .checkbox-item:hover { background: var(--bg-conv-hover); }
        .modal-footer {
            margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;
        }
        .btn-cancel {
            padding: 6px 16px; background: var(--bg-conv-hover); color: var(--text-primary);
            border-radius: 4px; font-size: 13px; cursor: pointer;
        }
        .btn-confirm {
            padding: 6px 16px; background: var(--accent); color: #fff;
            border-radius: 4px; font-size: 13px; cursor: pointer;
        }

        /* 主题/气泡颜色选择器 */
        .theme-switch-row {
            display: flex; gap: 8px; margin-top: 16px; align-items: center;
        }
        .theme-switch-btn {
            flex: 1; padding: 8px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 13px; color: var(--text-secondary);
            background: var(--bg-input-box); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .theme-switch-btn.active {
            border-color: var(--accent); color: var(--accent);
        }
        .bubble-color-row {
            display: flex; gap: 10px; margin-top: 12px; align-items: center;
            justify-content: center;
        }
        .bubble-color-dot {
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            border: 2px solid var(--border); transition: transform 0.15s;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #1f2329;
        }
        .bubble-color-dot:hover { transform: scale(1.1); }
        .bubble-color-dot.selected {
            border-color: var(--accent); transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--accent);
        }
        .setting-section-title {
            font-size: 13px; color: var(--text-secondary); margin: 16px 0 6px;
        }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px;
            border-radius: 6px; font-size: 13px; z-index: 999;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* 新消息页内弹窗（右下角） */
        #toast-notify-container {
            position: fixed; right: 20px; bottom: 20px; z-index: 9999;
            display: flex; flex-direction: column-reverse; gap: 8px;
            pointer-events: none;
        }
        .toast-notify {
            pointer-events: auto;
            width: 300px;
            background: var(--bg-toast);
            border-radius: 8px;
            box-shadow: 0 6px 24px var(--shadow);
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border-left: 4px solid var(--accent);
            animation: toast-slide-in 0.3s ease;
        }
        .toast-notify:hover { box-shadow: 0 8px 28px var(--shadow); }
        .toast-notify .toast-avatar {
            width: 36px; height: 36px; border-radius: 6px;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; flex-shrink: 0; overflow: hidden;
        }
        .toast-notify .toast-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .toast-notify .toast-body { flex: 1; min-width: 0; }
        .toast-notify .toast-title {
            font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toast-notify .toast-content {
            font-size: 12px; color: var(--text-secondary); line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .toast-notify .toast-close {
            font-size: 18px; color: var(--text-muted); cursor: pointer; line-height: 1;
            flex-shrink: 0; padding: 0 2px;
        }
        .toast-notify .toast-close:hover { color: var(--text-primary); }
        .toast-notify.fade-out { animation: toast-fade-out 0.3s ease forwards; }
        @keyframes toast-slide-in {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-fade-out {
            to { transform: translateX(120%); opacity: 0; }
        }
        @media (max-width: 768px) {
            #toast-notify-container { right: 8px; bottom: 64px; }
            .toast-notify { width: calc(100vw - 16px); }
        }

        /* 图片大图查看 */
        .lightbox {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: none;
            align-items: center; justify-content: center; z-index: 500; cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 4px; }

        .upload-progress {
            position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: #e5e5e5; overflow: hidden;
        }
        .upload-progress-bar {
            height: 100%; background: #07c160; transition: width 0.2s;
        }

        /* 返回按钮：桌面隐藏，移动端显示 */
        .back-btn { display: none !important; }

        /* ==================== 移动端适配（<=768px） ==================== */
        @media (max-width: 768px) {
            body { -webkit-tap-highlight-color: transparent; }

            /* 整体改为纵向布局 */
            .layout { display: flex; flex-direction: column; }

            /* 底部导航栏 */
            .navbar {
                order: 99;
                flex-direction: row;
                width: 100%;
                height: 56px;
                padding: 0;
                justify-content: space-around;
                align-items: center;
                flex-shrink: 0;
                border-top: 1px solid #1a1a1a;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .nav-avatar { display: none; }
            .nav-items {
                flex-direction: row;
                flex: 1;
                width: auto;
                justify-content: space-around;
                gap: 0;
            }
            .nav-bottom {
                width: auto;
                display: flex;
                flex-direction: row;
                align-items: center;
            }
            .nav-bottom .nav-item {
                width: 64px;
                height: 56px;
                flex: none;
                border-radius: 0;
            }
            .nav-items .nav-item {
                width: auto; height: 56px; flex: 1; border-radius: 0;
            }
            .nav-item.active::before { display: none; }
            .nav-item svg { width: 24px; height: 24px; }
            .nav-badge { top: 8px; right: 28%; }
            .nav-item:hover { background: transparent; }

            /* 侧栏全屏 */
            .sidebar {
                width: 100%;
                flex: 1;
                border-right: none;
            }
            .sidebar-header {
                padding: 10px 12px;
            }

            /* 聊天区：默认滑到右侧屏外，选中会话后滑入 */
            .chat-area {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 56px;
                z-index: 20;
                transform: translateX(100%);
                transition: transform 0.25s ease;
            }
            .layout.mobile-chat-open .chat-area {
                transform: translateX(0);
            }

            /* 返回按钮显示 */
            .back-btn { display: flex !important; }

            /* 详情面板：全屏覆盖 */
            .detail-panel {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 56px;
                width: 100%;
                z-index: 40;
                display: flex !important;
                transform: translateX(100%);
                transition: transform 0.25s ease;
                border-left: none;
            }
            .detail-panel.show { transform: translateX(0); }

            /* 聊天标题栏 */
            .chat-header {
                height: 52px;
                padding: 0 12px;
            }
            .chat-title { font-size: 15px; }

            /* 消息区 */
            .messages-area { padding: 12px; }
            .msg-content-wrap { max-width: 76%; }
            .msg-bubble.image img { max-width: 170px; max-height: 170px; }
            .msg-bubble.file { min-width: 180px; }

            /* 输入区（输入框字号>=16 防 iOS 自动放大） */
            .input-area { padding: 6px 12px 12px; }
            .input-box {
                font-size: 16px;
                min-height: 44px;
            }
            .send-btn { padding: 8px 20px; font-size: 14px; }

            /* 表情面板铺满宽度 */
            .emoji-panel {
                width: calc(100vw - 24px);
                max-width: none;
                max-height: 220px;
            }
            .emoji-grid { grid-template-columns: repeat(7, 1fr); }
            .emoji-item { width: 100%; height: 40px; }

            /* 模态弹窗 */
            .modal-overlay { padding: 12px; }
            .modal {
                width: 100%;
                max-width: none;
                padding: 16px;
                max-height: 88vh;
            }

            /* 登录页 */
            #auth-page { padding: 16px; }
            .auth-card { width: 100%; max-width: 360px; padding: 28px 20px; }

            /* 连接状态胶囊窄屏隐藏文字 */
            .conn-status .conn-text { display: none; }

            /* 图片大图 */
            .lightbox img { max-width: 96%; max-height: 96%; }
        }

        /* 超窄屏（<=380px）再收紧 */
        @media (max-width: 380px) {
            .emoji-grid { grid-template-columns: repeat(6, 1fr); }
            .msg-content-wrap { max-width: 80%; }
        }
    </style>
</head>
<body>

<!-- ==================== 登录/注册页 ==================== -->
<div id="auth-page">
    <div class="auth-card">
        <h1>AI Web Chat</h1>

<script>
// ================================================================
// State - 全局状态管理
// ================================================================
const State = {
    token: localStorage.getItem('token') || null,
    me: JSON.parse(localStorage.getItem('me') || 'null'),
    stompClient: null,
    connected: false,
    reconnectAttempts: 0,
    reconnectTimer: null,
    subscriptions: [],
    currentTab: 'sessions', // sessions | contacts
    activeChat: null, // { type: 'private'|'group', id, title }
    friends: [],
    groups: [],
    pendingRequests: [],
    pendingInvitations: [],
    messages: new Map(), // key -> [messageVO]
    unreadMap: new Map(), // key -> count
    sessionPreviews: new Map(), // key -> { lastContent, lastTime, ... }
    searchResults: [],
    currentEmojiTab: 'emoji',
    myEmojis: [],
    detailPanelOpen: false,
    searchMatches: [],
    searchCurrentIdx: -1,
    favorites: [],
};

// ================================================================
// API 请求封装
// ================================================================
async function api(url, options = {}) {
    const headers = { ...options.headers };
    if (State.token) {
        headers['Authorization'] = 'Bearer ' + State.token;
    }
    if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
    }
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) {
        forceLogout();
        throw new Error('未授权');
    }
    const data = await resp.json();
    if (!resp.ok) {
        throw new Error(data.error || data.message || '请求失败');
    }
    return data;
}

function apiGet(url) { return api(url); }
function apiPost(url, body) {
    return api(url, { method: 'POST', body: JSON.stringify(body) });
}
function apiDelete(url) { return api(url, { method: 'DELETE' }); }
function apiUpload(url, file) {
    const formData = new FormData();
    formData.append('file', file);
    return api(url, { method: 'POST', body: formData });
}

// ================================================================
// 认证相关
// ================================================================
let isLoginMode = true;

function switchAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('nickname-group').style.display = isLoginMode ? 'none' : 'block';
    document.getElementById('auth-submit').textContent = isLoginMode ? '登录' : '注册';
    document.getElementById('switch-text').textContent = isLoginMode ? '还没有账号？' : '已有账号？';
    document.getElementById('switch-link').textContent = isLoginMode ? '注册' : '登录';
    document.getElementById('auth-error').textContent = '';
}

async function handleAuth() {
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value;
    const nickname = document.getElementById('auth-nickname').value.trim();
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';

    if (!username || !password) {
        errEl.textContent = '用户名和密码不能为空';
        return;
    }

    const btn = document.getElementById('auth-submit');
    btn.disabled = true;

    try {
        if (isLoginMode) {
            const resp = await apiPost('/api/auth/login', { username, password });
            State.token = resp.token;
            State.me = { id: resp.userId, username: resp.username, nickname: resp.nickname, avatar: resp.avatar };
            localStorage.setItem('token', State.token);
            localStorage.setItem('me', JSON.stringify(State.me));
            enterMainPage();
        } else {
            await apiPost('/api/auth/register', { username, password, nickname: nickname || undefined });
            showToast('注册成功，请登录');
            switchAuthMode();
            document.getElementById('auth-username').value = username;
        }
    } catch (e) {
        errEl.textContent = e.message;
    } finally {
        btn.disabled = false;
    }
}

async function tryRestoreSession() {
    if (!State.token || !State.me) return false;
    try {
        const me = await apiGet('/api/users/me');
        State.me = me;
        localStorage.setItem('me', JSON.stringify(me));
        return true;
    } catch {
        forceLogout();
        return false;
    }
}

function forceLogout() {
    State.token = null;
    State.me = null;
    localStorage.removeItem('token');
    localStorage.removeItem('me');
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('auth-page').style.display = 'flex';
}

function logout() {
    if (State.stompClient) {
        try { State.stompClient.disconnect(); } catch {}
    }
    apiPost('/api/auth/logout', {}).catch(() => {});
    forceLogout();
}

async function enterMainPage() {
    document.getElementById('auth-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    renderNavAvatar();
    // 请求桌面通知权限 + 预热音频上下文（需用户交互后才能发声）
    requestNotifyPermission();
    getAudioContext();
    await refreshAll();
    connectWebSocket();
}

// 渲染
// ================================================================
function renderNavAvatar() {
    const el = document.getElementById('nav-avatar');
    const me = State.me;
    if (me && me.avatar) {
        el.innerHTML = '<img src="' + me.avatar + '">';
    } else {
        const name = me ? (me.nickname || me.username || '?') : '?';
        el.textContent = name.charAt(0).toUpperCase();
    }
}

function switchTab(tab) {
    State.currentTab = tab;
    document.getElementById('nav-session').classList.toggle('active', tab === 'sessions');
    document.getElementById('nav-contacts').classList.toggle('active', tab === 'contacts');
    document.getElementById('search-input').placeholder = tab === 'sessions' ? '搜索用户...' : '搜索好友...';
    renderSidebar();
    // 清空搜索
    State.searchResults = [];
}

function renderSidebar() {
    const container = document.getElementById('sidebar-list');
    container.innerHTML = '';

    if (State.currentTab === 'sessions') {
        renderSessions(container);
    } else {
        renderContacts(container);
    }
}

function renderSessions(container) {
    // 搜索结果优先
    if (State.searchResults.length > 0) {
        State.searchResults.forEach(u => {
            container.appendChild(createUserSearchItem(u));
        });
        return;
    }

    // 合并会话列表（来自后端 + 实时消息构建）
    const allSessions = new Map();

    // 后端会话
    State.sessionPreviews.forEach((conv, key) => {
        allSessions.set(key, conv);
    });

    // 好友中没有消息的也要显示
    State.friends.forEach(f => {
        const key = 'private:' + f.id;
        if (!allSessions.has(key)) {
            allSessions.set(key, {
                key, type: 'PRIVATE', peerId: f.id,
                title: f.nickname || f.username, avatar: f.avatar,
                lastContent: '', lastTime: null, unreadCount: State.unreadMap.get(key) || 0
            });
        } else {
            const c = allSessions.get(key);
            c.title = f.nickname || f.username;
            c.avatar = f.avatar;
        }
    });

    // 群聊
    State.groups.forEach(g => {
        const key = 'group:' + g.id;
        if (!allSessions.has(key)) {
            allSessions.set(key, {
                key, type: 'GROUP', groupId: g.id,
                title: g.name, lastContent: '',
                lastTime: null, unreadCount: State.unreadMap.get(key) || 0
            });
        } else {
            allSessions.get(key).title = g.name;
        }
    });

    // 排序：有时间的按时间倒序，没时间的在后面
    const sorted = Array.from(allSessions.values()).sort((a, b) => {
        if (!a.lastTime && !b.lastTime) return 0;
        if (!a.lastTime) return 1;
        if (!b.lastTime) return -1;
        return new Date(b.lastTime) - new Date(a.lastTime);
    });

    sorted.forEach(conv => {
        container.appendChild(createSessionItem(conv));
    });
}

function createSessionItem(conv) {
    const div = document.createElement('div');
    div.className = 'conv-item';
    if (State.activeChat && State.activeChat.key === conv.key) {
        div.classList.add('active');
    }

    // 头像
    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'conv-avatar';
    if (conv.type === 'GROUP') avatarDiv.classList.add('group');
    if (conv.avatar) {
        avatarDiv.innerHTML = '<img src="' + conv.avatar + '">';
    } else {
        avatarDiv.textContent = conv.type === 'GROUP' ? '#' : (conv.title || '?').charAt(0).toUpperCase();
    }

    // 内容
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'conv-body';

    const topRow = document.createElement('div');
    topRow.className = 'conv-top-row';
    topRow.innerHTML = '<span class="conv-name">' + escapeHtml(conv.title || '') + '</span>' +
                       '<span class="conv-time">' + formatTime(conv.lastTime) + '</span>';

    const bottomRow = document.createElement('div');
    bottomRow.className = 'conv-bottom-row';

    const unread = State.unreadMap.get(conv.key) || conv.unreadCount || 0;
    let previewText = conv.lastContent || '';
    if (conv.lastContentType === 'IMAGE') previewText = '[图片]';
    else if (conv.lastContentType === 'FILE') previewText = '[文件]';
    else if (conv.lastContentType === 'EMOJI') previewText = '[表情]';

    bottomRow.innerHTML = '<span class="conv-preview">' + escapeHtml(previewText) + '</span>';
    if (unread > 0) {
        const badge = document.createElement('span');
        badge.className = 'conv-unread';
        badge.textContent = unread > 99 ? '99+' : unread;
        bottomRow.appendChild(badge);
    }

    bodyDiv.appendChild(topRow);
    bodyDiv.appendChild(bottomRow);
    div.appendChild(avatarDiv);
    div.appendChild(bodyDiv);

    div.onclick = () => openConversation(conv);
    return div;
}

function renderContacts(container) {
    if (State.searchResults.length > 0) {
        State.searchResults.forEach(u => {
            container.appendChild(createUserSearchItem(u));
        });
        return;
    }

    // 好友列表
    if (State.friends.length === 0) {
        container.innerHTML = '<div style="padding:40px 16px;text-align:center;color:#b0b0b0;font-size:13px;">暂无好友</div>';
        return;
    }

    const titleDiv = document.createElement('div');
    titleDiv.style.cssText = 'padding:8px 16px;font-size:12px;color:#9a9a9a;background:#efefef;';
    titleDiv.textContent = '好友 (' + State.friends.length + ')';
    container.appendChild(titleDiv);

    State.friends.forEach(f => {
        const div = document.createElement('div');
        div.className = 'contact-item';
        const avatar = document.createElement('div');
        avatar.className = 'contact-avatar';
        if (f.avatar) {
            avatar.innerHTML = '<img src="' + f.avatar + '">';
        } else {
            avatar.textContent = (f.nickname || f.username || '?').charAt(0).toUpperCase();
        }
        const name = document.createElement('div');
        name.className = 'contact-name';
        name.textContent = f.nickname || f.username;
        div.appendChild(avatar);

        div.onclick = () => {

    if (State.groups.length > 0) {
        const groupTitle = document.createElement('div');
        groupTitle.style.cssText = 'padding:8px 16px;font-size:12px;color:#9a9a9a;background:#efefef;';
        groupTitle.textContent = '群组 (' + State.groups.length + ')';
        container.appendChild(groupTitle);

        State.groups.forEach(g => {
            const div = document.createElement('div');
            div.className = 'contact-item';
            const avatar = document.createElement('div');
            avatar.className = 'contact-avatar';
            avatar.style.background = '#7a7a7a';
            avatar.style.borderRadius = '8px';
            avatar.textContent = '#';

            name.textContent = g.name;

            div.appendChild(name);
            div.onclick = () => {

                    key, type: 'GROUP', groupId: g.id, title: g.name
                });
            };
            container.appendChild(div);
        });
    }
}

function createUserSearchItem(user) {
    const div = document.createElement('div');
    div.className = 'contact-item';
    const avatar = document.createElement('div');
    avatar.className = 'contact-avatar';
    if (user.avatar) {
        avatar.innerHTML = '<img src="' + user.avatar + '">';
    } else {
        avatar.textContent = (user.nickname || user.username || '?').charAt(0).toUpperCase();

// ================================================================
// 打开会话
// ================================================================
async function openConversation(conv) {
    State.activeChat = conv;

    // 清未读
    State.unreadMap.set(conv.key, 0);
    updateBadges();
    renderSidebar();

    // 移动端：切换到聊天视图
    document.querySelector('.layout').classList.add('mobile-chat-open');
    // 关闭详情面板（避免遮挡聊天）
    State.detailPanelOpen = false;
    document.getElementById('detail-panel').classList.remove('show');

    // 显示聊天区
    document.getElementById('chat-empty').style.display = 'none';
    document.getElementById('chat-main').style.display = 'flex';

    // 标题
    document.getElementById('chat-title').textContent = conv.title;
    if (conv.type === 'GROUP') {
        const g = State.groups.find(g => g.id === conv.groupId);
        const count = g && g.memberCount ? g.memberCount : '';
        document.getElementById('chat-subtitle').textContent = count ? ('(' + count + '人)') : '';
    } else {
        document.getElementById('chat-subtitle').textContent = '';
    }

    // 加载历史消息
    const key = conv.key;
    if (!State.messages.has(key)) {
        try {
            let history;
            if (conv.type === 'PRIVATE') {
                history = await apiGet('/api/messages/private?peerId=' + conv.peerId);
            } else {
                history = await apiGet('/api/messages/group?groupId=' + conv.groupId);
            }
            State.messages.set(key, history);
        } catch (e) {
            State.messages.set(key, []);
        }
    }

    renderMessages();

    // 标记已读
    const msgs = State.messages.get(key) || [];
    if (msgs.length > 0) {
        const lastId = msgs[msgs.length - 1].id;
        try {
            if (conv.type === 'PRIVATE') {
                await apiPost('/api/messages/read', { type: 'PRIVATE', peerId: conv.peerId, lastReadMessageId: lastId });
            } else {
                await apiPost('/api/messages/read', { type: 'GROUP', groupId: conv.groupId, lastReadMessageId: lastId });
            }
        } catch {}
    }

    // 详情面板
    renderDetailPanel();
}

// ================================================================
// 消息渲染
// ================================================================
function renderMessages() {
    const container = document.getElementById('messages-area');
    container.innerHTML = '';
    if (!State.activeChat) return;

    const msgs = State.messages.get(State.activeChat.key) || [];
    let lastDate = null;

    msgs.forEach(msg => {
        // 时间分隔
        const msgDate = formatDate(msg.sendTime);
        if (msgDate !== lastDate) {
            const sep = document.createElement('div');
            sep.className = 'time-separator';
            sep.textContent = msgDate;
            container.appendChild(sep);
            lastDate = msgDate;
        }

        container.appendChild(createMessageRow(msg));
    });

    // 滚到底部
    container.scrollTop = container.scrollHeight;
}

function createMessageRow(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    const isMine = msg.senderId === State.me.id;
    if (isMine) row.classList.add('mine');
    row.dataset.msgId = msg.id;

    // 头像
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (msg.senderAvatar) {
        avatar.innerHTML = '<img src="' + msg.senderAvatar + '">';
    } else {
        avatar.textContent = (msg.senderName || '?').charAt(0).toUpperCase();
    }

    // 内容区
    const contentWrap = document.createElement('div');
    contentWrap.className = 'msg-content-wrap';

    // 发送者名称（群聊显示）
    if (State.activeChat && State.activeChat.type === 'GROUP' && !isMine) {
        const nameEl = document.createElement('div');
        nameEl.className = 'msg-sender-name';
        nameEl.textContent = msg.senderName;
        contentWrap.appendChild(nameEl);
    }

    // 气泡
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    // 撤回消息
    if (msg.status === 'RECALLED') {
        bubble.className = 'msg-bubble recall-notice';
        bubble.textContent = (isMine ? '你' : msg.senderName) + ' 撤回了一条消息';
    } else {
        const ct = msg.contentType || 'TEXT';
        switch (ct) {
            case 'TEXT':
                bubble.classList.add('text');
                bubble.textContent = msg.content;
                break;
            case 'EMOJI':
                bubble.classList.add('emoji');
                bubble.textContent = msg.content;
                break;
            case 'IMAGE':
                bubble.classList.add('image');
                if (msg.attachment) {
                    const img = document.createElement('img');
                    img.src = msg.attachment.thumbUrl || msg.attachment.url;
                    img.onclick = () => showLightbox(msg.attachment.url);
                    bubble.appendChild(img);
                }
                break;
            case 'FILE':
                bubble.classList.add('file');
                if (msg.attachment) {
                    bubble.innerHTML =
                        '<div class="file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="13" y2="18"/></svg></div>' +
                        '<div class="file-info">' +
                        '<div class="file-name">' + escapeHtml(msg.attachment.name || '文件') + '</div>' +
                        '<div class="file-size">' + formatFileSize(msg.attachment.size) + '</div>' +
                        '</div>' +
                        '<a class="file-download" href="' + msg.attachment.url + '" target="_blank" download>下载</a>';
                }
                break;
        }

        // 操作菜单：所有消息可收藏；自己的消息可撤回/删除
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        // 收藏按钮（所有人通用）
        const favBtn = document.createElement('div');
        favBtn.className = 'msg-action-btn';
        favBtn.textContent = '收藏';
        favBtn.onclick = (e) => { e.stopPropagation(); favoriteMessage(msg.id, favBtn); };
        actions.appendChild(favBtn);
        if (isMine) {
            const recallBtn = document.createElement('div');
            recallBtn.className = 'msg-action-btn';
            recallBtn.textContent = '撤回';
            recallBtn.onclick = (e) => { e.stopPropagation(); recallMessage(msg.id); };
            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'msg-action-btn';
            deleteBtn.textContent = '删除';
            deleteBtn.style.color = '#f53f3f';
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteMessage(msg.id); };
            actions.appendChild(recallBtn);
            actions.appendChild(deleteBtn);
        }
        bubble.style.position = 'relative';
        bubble.appendChild(actions);
    }

    contentWrap.appendChild(bubble);

    // 已读状态（私聊自己发送的消息）
    if (isMine && msg.type === 'PRIVATE' && msg.status !== 'RECALLED' && msg.read !== null && msg.read !== undefined) {
        const readStatus = document.createElement('div');
        readStatus.className = 'msg-read-status';
        readStatus.textContent = msg.read ? '已读' : '未读';
        contentWrap.appendChild(readStatus);
    }

    row.appendChild(avatar);
    row.appendChild(contentWrap);

    // 移动端：点击消息行切换操作菜单（桌面端用 hover）
    row.addEventListener('click', (ev) => {
        // 仅触屏设备生效（避免影响桌面 hover 体验）
        if (!isTouchDevice()) return;
        // 点击操作按钮自身不切换
        if (ev.target.closest('.msg-actions')) return;
        const wasActive = row.classList.contains('actions-active');
        // 先关闭其他行的菜单
        document.querySelectorAll('.msg-row.actions-active').forEach(r => {
            if (r !== row) r.classList.remove('actions-active');
        });
        row.classList.toggle('actions-active', !wasActive);
    });

    return row;
}

function isTouchDevice() {
    return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
}

// ================================================================
// 发送消息
// ================================================================
function handleInput() {}

function handleInputKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleSend();
    }
}

async function handleSend() {
    if (!State.activeChat) return;
    const input = document.getElementById('input-box');
    const content = input.value.trim();
    if (!content) return;

    const req = {
        type: State.activeChat.type,
        content: content,
        contentType: 'TEXT'
    };
    if (State.activeChat.type === 'PRIVATE') {
        req.receiverId = State.activeChat.peerId;
    } else {
        req.groupId = State.activeChat.groupId;
    }

    input.value = '';
    closeEmojiPanel();

    try {
        await apiPost('/api/messages', req);
        // 消息会通过 WebSocket 回推，这里不需要手动渲染
    } catch (e) {
        showToast(e.message);
        input.value = content; // 恢复内容
    }
}

// ================================================================
// 消息撤回/删除
// ================================================================
async function recallMessage(msgId) {
    if (!confirm('确定撤回这条消息？')) return;
    try {
        await apiPost('/api/messages/' + msgId + '/recall', {});
    } catch (e) {
        showToast(e.message);
    }
}

async function deleteMessage(msgId) {
    if (!confirm('确定删除这条消息？')) return;
    try {
        await apiDelete('/api/messages/' + msgId);
    } catch (e) {
        showToast(e.message);
    }
}

// ================================================================
// 文件上传
// ================================================================
async function handleImageUpload(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';
    await uploadAndSendFile(file, 'IMAGE');
}

async function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';
    await uploadAndSendFile(file, file.type.startsWith('image/') ? 'IMAGE' : 'FILE');
}

async function uploadAndSendFile(file, contentType) {
    if (!State.activeChat) return;
    try {
        showToast('上传中...');
        const attachment = await apiUpload('/api/messages/upload', file);
        const req = {
            type: State.activeChat.type,
            contentType: contentType,
            attachmentUrl: attachment.url,
            attachmentName: attachment.name,
            attachmentSize: attachment.size,
            attachmentThumb: attachment.thumbUrl,
            content: ''
        };
        if (State.activeChat.type === 'PRIVATE') {
            req.receiverId = State.activeChat.peerId;
        } else {
            req.groupId = State.activeChat.groupId;
        }
        await apiPost('/api/messages', req);
    } catch (e) {
        showToast(e.message);
    }
}

// ================================================================
// WebSocket 连接（含指数退避重连）
// ================================================================
function connectWebSocket() {
    if (State.stompClient && State.connected) return;

    updateConnStatus('connecting');

    const socket = new SockJS('/ws?token=' + State.token);
    const stompClient = Stomp.over(socket);
    stompClient.debug = null; // 关闭调试日志
    stompClient.heartbeat.outgoing = 10000;
    stompClient.heartbeat.incoming = 10000;

    stompClient.connect({}, () => {
        State.stompClient = stompClient;
        State.connected = true;
        State.reconnectAttempts = 0;
        updateConnStatus('connected');
        subscribeAll();
    }, (error) => {
        State.connected = false;
        updateConnStatus('disconnected');
        scheduleReconnect();
    });
}

function subscribeAll() {
    // 取消旧订阅
    State.subscriptions.forEach(sub => { try { sub.unsubscribe(); } catch {} });
    State.subscriptions = [];

    if (!State.stompClient || !State.connected) return;

    // 订阅私聊通道
    State.subscriptions.push(State.stompClient.subscribe('/topic/user.' + State.me.id, (msg) => {
        handleMessage(JSON.parse(msg.body));
    }));

    // 订阅系统通知通道
    State.subscriptions.push(State.stompClient.subscribe('/topic/notify.' + State.me.id, (msg) => {
        handleNotify(JSON.parse(msg.body));
    }));

    // 订阅所有群通道
    State.groups.forEach(g => {
        State.subscriptions.push(State.stompClient.subscribe('/topic/group.' + g.id, (msg) => {
            handleMessage(JSON.parse(msg.body));
        }));
    });
}

function scheduleReconnect() {
    if (State.reconnectTimer) clearTimeout(State.reconnectTimer);
    const attempts = State.reconnectAttempts++;
    // 指数退避: 1s, 2s, 4s, 8s, 15s, 30s
    const delays = [1000, 2000, 4000, 8000, 15000, 30000];
    const delay = delays[Math.min(attempts, delays.length - 1)];
    updateConnStatus('disconnected', '第 ' + (attempts + 1) + ' 次重连，' + (delay / 1000) + ' 秒后');
    State.reconnectTimer = setTimeout(async () => {
        // 重连成功后恢复数据
        await refreshAll();
        connectWebSocket();
        // 离线补偿：如果当前有打开的会话，刷新消息
        if (State.activeChat) {
            const key = State.activeChat.key;
            State.messages.delete(key);
            await openConversation(State.activeChat);
        }
    }, delay);
}

function updateConnStatus(status, customText) {
    const el = document.getElementById('conn-status');
    const textEl = document.getElementById('conn-text');
    el.className = 'conn-status ' + status;
    if (status === 'connected') {
        textEl.textContent = '已连接';
    } else if (status === 'connecting') {
        textEl.textContent = customText || '连接中...';
    } else {
        textEl.textContent = customText || '已断开';
    }
}

// ================================================================
// 消息处理
// ================================================================
function handleMessage(msg) {
    if (!msg) return;

    // 确定会话 key
    let key;
    if (msg.type === 'PRIVATE') {
        const otherId = msg.senderId === State.me.id ? msg.receiverId : msg.senderId;
        key = 'private:' + otherId;
    } else {
        key = 'group:' + msg.groupId;
    }

    // 存入消息列表
    if (!State.messages.has(key)) {
        State.messages.set(key, []);
    }
    const msgs = State.messages.get(key);
    const existIdx = msgs.findIndex(m => m.id === msg.id);
    if (existIdx >= 0) {
        msgs[existIdx] = msg; // 更新（撤回场景）
    } else {
        msgs.push(msg);
    }

    // 更新会话预览
    const conv = State.sessionPreviews.get(key);
    if (conv) {
        conv.lastContent = previewText(msg);
        conv.lastContentType = msg.contentType;
        conv.lastTime = msg.sendTime;
    } else {
        // 新会话
        const newConv = {
            key, type: msg.type,
            lastContent: previewText(msg),
            lastContentType: msg.contentType,
            lastTime: msg.sendTime,
            unreadCount: 0
        };
        if (msg.type === 'PRIVATE') {
            newConv.peerId = msg.senderId === State.me.id ? msg.receiverId : msg.senderId;
            const f = State.friends.find(f => f.id === newConv.peerId);
            if (f) {
                newConv.title = f.nickname || f.username;
                newConv.avatar = f.avatar;
            }
        } else {
            newConv.groupId = msg.groupId;
            const g = State.groups.find(g => g.id === msg.groupId);
            if (g) newConv.title = g.name;
        }
        State.sessionPreviews.set(key, newConv);
    }

    // 未读数处理
    const isActiveChat = State.activeChat && State.activeChat.key === key;
    const isMine = msg.senderId === State.me.id;
    const isPageVisible = !document.hidden;
    // 当前会话且页面可见：视为已读；否则计为未读
    const effectivelyRead = isActiveChat && isPageVisible;

    if (effectivelyRead) {
        // 当前会话且页面可见：直接渲染 + 标记已读
        renderMessages();
        if (!isMine && msg.status !== 'RECALLED') {
            markConversationRead(key, msg.id);
        }
    } else if (!isMine && msg.status !== 'RECALLED') {
        // 非当前会话，或当前会话但页面失焦：增加未读
        const current = State.unreadMap.get(key) || 0;
        State.unreadMap.set(key, current + 1);
        // 当前会话但页面失焦：仍渲染消息（用户回来时直接看到）
        if (isActiveChat) {
            renderMessages();
        }
    } else if (isActiveChat) {
        // 当前会话可见且自己发的：直接渲染
        renderMessages();
    }

    renderSidebar();
    updateBadges();

    // 任何情况下收到对方消息都播放提示音
    if (!isMine && msg.status !== 'RECALLED') {
        playMessageSound();
    }
    // 原生桌面通知：仅非已读场景（避免当前会话可见时打扰）
    const needAlert = !isMine && msg.status !== 'RECALLED' && !effectivelyRead;
    if (needAlert) {
        showNotification(msg);
    }
    // 页内右下角弹窗：非当前会话时显示（当前会话页面失焦的情况由原生通知覆盖）
    if (!isMine && msg.status !== 'RECALLED' && !isActiveChat) {
        showInPageToast(msg);
    }
}

function previewText(msg) {
    if (msg.status === 'RECALLED') return '消息已撤回';
    switch (msg.contentType) {
        case 'TEXT': return msg.content;
        case 'EMOJI': return msg.content;
        case 'IMAGE': return '[图片]';
        case 'FILE': return '[文件] ' + (msg.attachment ? msg.attachment.name : '');
        default: return msg.content || '';
    }
}

async function markConversationRead(key, lastMsgId) {
    const parts = key.split(':');
    const type = parts[0] === 'private' ? 'PRIVATE' : 'GROUP';
    try {
        if (type === 'PRIVATE') {
            const peerId = parseInt(parts[1]);
            await apiPost('/api/messages/read', { type: 'PRIVATE', peerId, lastReadMessageId: lastMsgId });
        } else {
            const groupId = parseInt(parts[1]);
            await apiPost('/api/messages/read', { type: 'GROUP', groupId, lastReadMessageId: lastMsgId });
        }
    } catch {}
}

// ================================================================
// 通知处理
// ================================================================
function handleNotify(notify) {
    if (!notify || !notify.type) return;

    switch (notify.type) {
        case 'FRIEND_REQUEST':
            showToast('收到新的好友申请');
            refreshPendingRequests();
            updateBadges();
            break;
        case 'FRIEND_HANDLED':
            const handled = notify.payload;
            if (handled.action === 'ACCEPTED') {
                showToast('好友申请已通过');
                refreshFriends();
                refreshConversations();
            } else {
                showToast('好友申请被拒绝');
            }
            renderSidebar();
            break;
        case 'GROUP_INVITATION':
            showToast('收到新的群邀请');
            refreshPendingInvitations();
            updateBadges();
            break;
        case 'GROUP_INVITATION_HANDLED':
            refreshGroups();
            // 如果是 ACCEPTED，需要重新订阅群通道
            setTimeout(() => {
                if (State.connected) {
                    subscribeAll();
                }
            }, 500);
            break;
        case 'MESSAGE_RECALL':
            // 消息已通过 /topic/user 或 /topic/group 推送更新
            break;
        case 'MESSAGE_DELETE':
            handleDeleteNotify(notify.payload);
            break;
        case 'READ_RECEIPT':
            // 对方已读，更新消息状态
            handleReadReceipt(notify.payload);
            break;
        case 'MEMBER_JOINED':
            refreshGroups();
            break;
    }
}

function handleDeleteNotify(payload) {
    if (!payload) return;
    // 从本地消息列表删除
    State.messages.forEach((msgs, key) => {
        const idx = msgs.findIndex(m => m.id === payload.messageId);
        if (idx >= 0) {
            msgs.splice(idx, 1);
            if (State.activeChat && State.activeChat.key === key) {
                renderMessages();
            }
        }
    });
}

function handleReadReceipt(payload) {
    if (!payload) return;
    // 更新私聊消息的已读状态
    const key = 'private:' + payload.peerId;
    const msgs = State.messages.get(key);
    if (!msgs) return;
    msgs.forEach(m => {
        if (m.senderId === State.me.id && m.id <= payload.lastReadMessageId) {
            m.read = true;
        }
    });
    if (State.activeChat && State.activeChat.key === key) {
        renderMessages();
    }
}

function updateBadges() {
    // 会话总未读
    let totalUnread = 0;
    State.unreadMap.forEach(count => { totalUnread += count; });

    // Android WebView 套壳：同步启动器图标角标（传 0 自动清除）
    if (window.AndroidBridge && typeof AndroidBridge.setBadge === 'function') {
        try { AndroidBridge.setBadge(totalUnread); } catch (e) {}
    }

    const sessionBadge = document.getElementById('badge-sessions');
    if (totalUnread > 0) {
        sessionBadge.style.display = 'inline';
        sessionBadge.textContent = totalUnread > 99 ? '99+' : totalUnread;
    } else {
        sessionBadge.style.display = 'none';
    }
    // 浏览器标签页标题展示未读数
    updateDocumentTitle(totalUnread);

    // 好友申请
    const reqCount = State.pendingRequests.length;
    const reqBadge = document.getElementById('badge-requests');
    if (reqCount > 0) {
        reqBadge.style.display = 'inline';
        reqBadge.textContent = reqCount > 99 ? '99+' : reqCount;
    } else {
        reqBadge.style.display = 'none';
    }
}

function updateDocumentTitle(totalUnread) {

        totalUnread = 0;
        State.unreadMap.forEach(c => totalUnread += c);
    }
    const base = 'AI Web Chat';
    document.title = totalUnread > 0 ? `(${totalUnread > 99 ? '99+' : totalUnread}) ${base}` : base;
}

function requestNotifyPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
        Notification.requestPermission();
    }
}

let audioContext = null;
function getAudioContext() {
    if (!audioContext) {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            audioContext = null;
        }
    }
    return audioContext;
}

// 收到新消息的提示音（Web Audio 合成，无需音频文件）
function playMessageSound() {
    const ctx = getAudioContext();
    if (!ctx) return;
    try {
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        // 双音叠加：880Hz 主音 + 1320Hz 泛音，营造清脆"叮"声
        [880, 1320].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            const start = now + i * 0.04;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(i === 0 ? 0.25 : 0.12, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
            osc.start(start);
            osc.stop(start + 0.35);
        });
    } catch (e) {}
}

function showNotification(msg) {
    const senderName = msg.senderName || '新消息';
    const body = previewText(msg);
    let tag;
    if (msg.type === 'PRIVATE') {
        tag = 'awc-p-' + msg.senderId;
    } else {
        tag = 'awc-g-' + msg.groupId;
    }

    // Android WebView 套壳环境：走原生系统通知 + 图标角标
    if (window.AndroidBridge && typeof AndroidBridge.showNotification === 'function') {
        try {
            AndroidBridge.showNotification(senderName, body, tag);
        } catch (e) {}
        return; // 已交给原生层，不再走浏览器 Notification
    }

    // 浏览器环境：Web Notification API
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
        const n = new Notification(senderName, {
            body: body,
            tag: tag,
            icon: msg.senderAvatar || undefined,
            silent: true,  // 自己播放声音，避免系统提示音重复
            requireInteraction: false
        });
        n.onclick = () => {
            window.focus();
            n.close();
        };
        setTimeout(() => { try { n.close(); } catch {} }, 6000);
    } catch (e) {}
}

// 页内右下角弹窗（不依赖系统通知权限，HTTP/HTTPS 均可用）
function showInPageToast(msg) {
    const container = document.getElementById('toast-notify-container');
    if (!container) return;

    // 最多保留 3 条，超出移除最早的
    while (container.children.length >= 3) {
        container.removeChild(container.firstChild);
    }

    const senderName = msg.senderName || '新消息';
    const preview = previewText(msg);
    const avatarHtml = msg.senderAvatar
        ? '<img src="' + msg.senderAvatar + '">'
        : escapeHtml((senderName || '?').charAt(0).toUpperCase());

    let convKey;
    if (msg.type === 'PRIVATE') {
        const otherId = msg.senderId === State.me.id ? msg.receiverId : msg.senderId;
        convKey = 'private:' + otherId;
    } else {
        convKey = 'group:' + msg.groupId;
    }

    const toast = document.createElement('div');
    toast.className = 'toast-notify';
    toast.innerHTML =
        '<div class="toast-avatar">' + avatarHtml + '</div>' +
        '<div class="toast-body">' +
        '<div class="toast-title">' + escapeHtml(senderName) + '</div>' +
        '<div class="toast-content">' + escapeHtml(preview) + '</div>' +
        '</div>' +
        '<div class="toast-close">×</div>';

    toast.onclick = () => {
        removeToastNotify(toast);
        // 跳转到对应会话
        const conv = State.sessionPreviews.get(convKey);
        if (conv) {
            openConversation(conv);
        } else {
            // 没有会话预览，手动构建
            if (msg.type === 'PRIVATE') {
                openConversation({
                    key: convKey, type: 'PRIVATE',
                    peerId: msg.senderId === State.me.id ? msg.receiverId : msg.senderId,
                    title: senderName, avatar: msg.senderAvatar
                });
            }
        }
    };
    const closeBtn = toast.querySelector('.toast-close');
    closeBtn.onclick = (e) => {
        e.stopPropagation();
        removeToastNotify(toast);
    };

    container.appendChild(toast);
    setTimeout(() => removeToastNotify(toast), 5000);
}

function removeToastNotify(toast) {
    if (!toast || !toast.parentNode) return;
    toast.classList.add('fade-out');
    setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 300);
}

// 页面可见性变化：重新计算标题 + 回到前台时清当前会话未读

// 页面重新可见/聚焦时，清掉当前打开会话的未读数（之前因为失焦累积的）
function clearActiveChatUnread() {
    if (!State.activeChat) return;
    const key = State.activeChat.key;
    const unread = State.unreadMap.get(key) || 0;
    if (unread === 0) return;
    State.unreadMap.set(key, 0);
    const msgs = State.messages.get(key) || [];
    if (msgs.length > 0) {
        markConversationRead(key, msgs[msgs.length - 1].id);
    }
    renderSidebar();
    updateBadges();
}

                grid.appendChild(item);
            });
            container.appendChild(grid);
        });
    } else if (State.currentEmojiTab === 'sticker') {
        const grid = document.createElement('div');
        grid.className = 'emoji-grid';
        STICKER_DATA.forEach(e => {
            const item = document.createElement('div');

            item.onclick = () => insertEmoji(e);

        });
        container.appendChild(grid);
    } else if (State.currentEmojiTab === 'mine') {
        const grid = document.createElement('div');
        grid.className = 'emoji-grid';
        if (State.myEmojis.length === 0) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#b0b0b0;font-size:13px;">还没有自定义表情</div>';
        } else {
            State.myEmojis.forEach(emoji => {
                const item = document.createElement('div');
                item.className = 'emoji-item custom-emoji';
                item.innerHTML = '<img src="' + emoji.url + '" title="' + escapeHtml(emoji.name || '') + '">';
                item.onclick = () => sendEmojiMessage(emoji.url);
                grid.appendChild(item);
            });
            container.appendChild(grid);
        }

        // 上传区
        const uploadZone = document.createElement('div');
        uploadZone.className = 'emoji-upload-zone';
        uploadZone.innerHTML = '<span class="emoji-upload-btn">+ 添加自定义表情</span>';
        uploadZone.onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;
                try {
                    await apiUpload('/api/emojis', file);
                    await refreshMyEmojis();
                    renderEmojiPanel();
                    showToast('表情上传成功');
                } catch (e) {
                    showToast(e.message);
                }
            };
            input.click();
        };
        container.appendChild(uploadZone);
    }
}

function insertEmoji(emoji) {
    const input = document.getElementById('input-box');
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
    input.focus();
    input.selectionStart = input.selectionEnd = start + emoji.length;

    // 记录最近使用
    saveRecentEmoji(emoji);
}

function sendEmojiMessage(url) {
    if (!State.activeChat) return;
    const req = {
        type: State.activeChat.type,
        contentType: 'IMAGE',
        attachmentUrl: url,
        attachmentThumb: url,
        content: ''
    };
    if (State.activeChat.type === 'PRIVATE') {
        req.receiverId = State.activeChat.peerId;
    } else {
        req.groupId = State.activeChat.groupId;
    }
    apiPost('/api/messages', req).catch(e => showToast(e.message));
}

function saveRecentEmoji(emoji) {
    let recent = JSON.parse(localStorage.getItem('recentEmojis') || '[]');
    recent = recent.filter(e => e !== emoji);
    recent.unshift(emoji);
    recent = recent.slice(0, 8);
    localStorage.setItem('recentEmojis', JSON.stringify(recent));
}

    State.searchCurrentIdx = -1;
