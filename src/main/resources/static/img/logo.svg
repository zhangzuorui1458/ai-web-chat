<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 主气泡蜜桃日落渐变（温暖亲和） -->
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFD09C"/>
      <stop offset="50%" stop-color="#FF9472"/>
      <stop offset="100%" stop-color="#FF5E8A"/>
    </linearGradient>
    <!-- 顶部柔和高光 -->
    <radialGradient id="topGloss" cx="0.35" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 左侧边缘高光 -->
    <linearGradient id="edgeGloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 柔和投影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8"/>
      <feOffset dx="0" dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主气泡：圆润造型 + 尾尖朝左下 -->
  <path d="M 13 27
           Q 13 11 32 11
           Q 51 11 51 27
           Q 51 43 32 43
           Q 28 43 25 42
           L 19 49.5
           Q 16.5 51.5 15.8 48.5
           L 14.8 41
           Q 13 38.5 13 27 Z"
        fill="url(#bubbleGrad)" filter="url(#softShadow)"/>

  <!-- 顶部柔和高光层 -->
  <path d="M 13 27
           Q 13 11 32 11
           Q 51 11 51 27
           Q 51 43 32 43
           Q 28 43 25 42
           L 19 49.5
           Q 16.5 51.5 15.8 48.5
           L 14.8 41
           Q 13 38.5 13 27 Z"
        fill="url(#topGloss)"/>

  <!-- 左侧边缘高光（增加立体感） -->
  <path d="M 13 27
           Q 13 11 32 11
           Q 38 11 42.5 13
           Q 24 12 18 22
           Q 14.5 30 15.8 41
           L 14.8 41
           Q 13 38.5 13 27 Z"
        fill="url(#edgeGloss)"/>

  <!-- Q 萌笑脸：两只大眼睛 + 高光点 -->
  <circle cx="25" cy="26" r="3.2" fill="#FFFFFF"/>
  <circle cx="39" cy="26" r="3.2" fill="#FFFFFF"/>
  <!-- 眼睛瞳孔高光（小黑点增加灵动感） -->
  <circle cx="26.2" cy="25" r="1.1" fill="#0A2540"/>
  <circle cx="40.2" cy="25" r="1.1" fill="#0A2540"/>
  <circle cx="25.7" cy="24.5" r="0.4" fill="#FFFFFF"/>
  <circle cx="39.7" cy="24.5" r="0.4" fill="#FFFFFF"/>

  <!-- 微笑曲线 -->
  <path d="M 25 32 Q 32 37.5 39 32"
        stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- 腮红（粉色小圆点，增加 Q 萌感） -->
  <circle cx="20.5" cy="31.5" r="1.8" fill="#FF6B9D" opacity="0.45"/>
  <circle cx="43.5" cy="31.5" r="1.8" fill="#FF6B9D" opacity="0.45"/>
</svg>
